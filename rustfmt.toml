# stable-only options: CI format check runs on the stable toolchain
# (nightly-only options like imports_granularity, brace_style and
# fn_single_line were removed when the project moved off nightly rustfmt)
struct_lit_width = 30
single_line_let_else_max_width = 60
chain_width = 80
fn_call_width = 65
use_field_init_shorthand = true
